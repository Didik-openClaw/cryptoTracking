name: CI

# Tests and builds every push. On the default branch it also deploys to PHP
# shared hosting (Hostinger) over SSH when the HOSTINGER_* secrets are set
# (see hosting/README.md): after every push and every 3 hours, so the
# leaderboard and news snapshots bundled at build time stay fresh.
# For a Netlify site, the schedule triggers its build hook instead.

on:
  push:
  pull_request:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:hosting

      # The same files as a downloadable zip (Actions → run → Artifacts), for uploading by FTP / File Manager.
      - name: Save the upload package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dty-hosting-upload
          path: dist/
          include-hidden-files: true
          retention-days: 7

      - name: Deploy to Hostinger
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          TARGET: ${{ vars.HOSTINGER_PATH || 'domains/dtycryptoterminal.com/public_html' }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "Secrets HOSTINGER_HOST / HOSTINGER_USER / HOSTINGER_SSH_KEY belum diisi; deploy dilewati."
            exit 0
          fi
          PORT="${SSH_PORT:-65002}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            CHECK=yes
          else
            CHECK=accept-new
          fi
          SSH="ssh -p $PORT -i ~/.ssh/deploy -o StrictHostKeyChecking=$CHECK -o ServerAliveInterval=15"
          # Upload everything except the server's own folders, then remove files that are gone from the build.
          rsync -rlzt --checksum --delete-after --exclude='.well-known/' --exclude='dty-private/' \
            -e "$SSH" dist/ "$SSH_USER@$SSH_HOST:$TARGET/"
          echo "Deploy selesai: $(date -u '+%Y-%m-%d %H:%M UTC')"
          ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null | head -3 || true

  refresh-netlify:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Netlify rebuild
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Secret NETLIFY_BUILD_HOOK belum diisi; dilewati."; exit 0; fi
          curl -fsS -X POST -d '{}' "$HOOK"
