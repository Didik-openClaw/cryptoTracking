name: CI

# Tests every push. When the site is hosted on Netlify (netlify.toml), the
# schedule also asks Netlify to rebuild so the bundled leaderboard and news
# snapshots stay fresh; a VPS does this itself with cron (deploy/README.md).

on:
  push:
  pull_request:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  refresh-data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Netlify rebuild
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Secret NETLIFY_BUILD_HOOK belum diisi; dilewati."; exit 0; fi
          curl -fsS -X POST -d '{}' "$HOOK"
