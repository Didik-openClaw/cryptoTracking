# Nginx site for a VPS: forwards everything to the Node server on port 8888.
# Install (replace example.com with your domain):
#   sed 's/example\.com/yourdomain.com/g' deploy/nginx.conf > /etc/nginx/sites-available/dty
#   ln -s /etc/nginx/sites-available/dty /etc/nginx/sites-enabled/dty && nginx -t && systemctl reload nginx
# then add HTTPS with: certbot --nginx -d yourdomain.com -d www.yourdomain.com --redirect

# Slows down password and code guessing on /api/ (per visitor IP).
limit_req_zone $binary_remote_addr zone=dty_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 64k;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location /api/ {
        limit_req zone=dty_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8888;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8888;
        include /etc/nginx/proxy_params;
    }
}
